# Local equivalents of the existing R2 object store and Upstash request limiter.
# No catalogue workers or job queues are introduced.
services:
  documents:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jobstash-career-documents
    command: server /data
    ports: ['127.0.0.1:59000:9000']
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?}
    volumes: ['career-documents:/data']
    networks: [local]
  rate-limit:
    image: redis:7.4-alpine
    container_name: jobstash-career-rate-limit
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [internal]
  rate-limit-http:
    image: hiett/serverless-redis-http:0.0.10
    container_name: jobstash-career-rate-limit-http
    ports: ['127.0.0.1:58079:80']
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?}
      SRH_CONNECTION_STRING: redis://rate-limit:6379
    networks: [internal, local]
networks:
  internal: {internal: true}
  local: {}
volumes:
  career-documents: {}
